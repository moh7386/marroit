<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قائمة الطعام - فندق ماريوت</title>
  <style>
    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fff8f0;
      margin: 0;
      padding: 0;
    }
    header {
      background: linear-gradient(to right, #8e44ad, #6c3483);
      color: white;
      padding: 25px 0;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2em;
    }
    header p {
      margin: 5px 0 0;
      font-size: 1.2em;
    }
    .menu {
      max-width: 900px;
      margin: 40px auto;
      background-color: #ffffff;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    h2 {
      color: #6c3483;
      border-bottom: 2px solid #ddd;
      padding-bottom: 8px;
      margin-top: 30px;
      font-size: 1.5em;
    }
    .item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }
    .item:last-child {
      border-bottom: none;
    }
    .name {
      font-weight: bold;
      color: #333;
    }
    .en {
      font-size: 0.9em;
      color: #777;
    }
    .price {
      color: #8e44ad;
      font-weight: bold;
      font-size: 1em;
    }
    @media (max-width: 600px) {
      .item {
        flex-direction: column;
        align-items: flex-start;
      }
      .price {
        align-self: flex-end;
        margin-top: 5px;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>قائمة الطعام | Menu</h1>
  <p>مطعم فندق ماريوت | Marriott Hotel Restaurant</p>
</header>

<div class="menu" id="menu"></div>

<script>
  fetch('config.json')
    .then(response => response.json())
    .then(data => {
      const menuContainer = document.getElementById('menu');
      for (const section of data.menu) {
        const sectionTitle = document.createElement('h2');
        sectionTitle.textContent = section.title_ar + ' | ' + section.title_en;
        menuContainer.appendChild(sectionTitle);

        for (const item of section.items) {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'item';

          const nameDiv = document.createElement('div');
          nameDiv.className = 'name';
          nameDiv.innerHTML = item.name_ar + '<div class="en">' + item.name_en + '</div>';

          const priceDiv = document.createElement('div');
          priceDiv.className = 'price';
          priceDiv.textContent = item.price + ' ريال';

          itemDiv.appendChild(nameDiv);
          itemDiv.appendChild(priceDiv);
          menuContainer.appendChild(itemDiv);
        }
      }
    })
    .catch(error => {
      console.error('فشل تحميل البيانات:', error);
      document.getElementById('menu').textContent = 'حدث خطأ أثناء تحميل القائمة.';
    });
</script>

</body>
</html>
